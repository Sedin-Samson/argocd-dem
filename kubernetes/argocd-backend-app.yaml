apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-backend-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Sedin-Samson/argocd-dem.git'
    targetRevision: 'backend-v1.0.0'
    path: 'kubernetes/backend'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
