apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: dev
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: frontend
        image: 156916773321.dkr.ecr.ap-south-1.amazonaws.com/argocd-demo-frontend:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80